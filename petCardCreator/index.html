<!DOCTYPE html>
<!--Jake Zamarripa 9/7/26 -->

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pet Gallery</title>
<link rel="stylesheet" href="petCardHW.css">

</head>
<body>

  <h1 id="galleryHeading">Pet Gallery</h1>

  <div class="galleryContainer">
    <img id="PetImage" src="" alt="Pet image">

    <dl class="petDetails">
      <dt>Name:</dt>
      <dd id="petName"></dd>

      <!--Finish the <dt> and <dd> tags for the Details, Owner, Owner Phone, petID-->
      <dt>Details:</dt>
      <dd id="petDetails"></dd>

      <dt>Owner:</dt>
      <dd id="petOwner"></dd>

      <dt>Owner Phone:</dt>
      <dd id="OwnerPhone"></dd>

      <dt>ID:</dt>
      <dd id="petID"></dd>
   
    </dl>
  </div>

  <div class="buttons">
    <button id="prev">Previous</button>
    <button id="next">Next</button>
  </div>
<script src="cardCreator.js"></script>
</body>
</html>
